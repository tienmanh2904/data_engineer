version: '3'

services:
  # CASSANDRA NODE 1 (SEED NODE)
  cassandra-1:
    image: cassandra:4.1
    container_name: cassandra-1
    restart: always
    
    # CRITICAL SETTING: Host Networking
    # This removes Docker's network isolation so the container can 
    # see and bind to the specific Private IP (eth1) of the Droplet.
    network_mode: host
    
    environment:
      # --- CLUSTER CONFIG ---
      - CASSANDRA_CLUSTER_NAME=ChatAppCluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_NUM_TOKENS=256

      # --- NETWORK BINDING (Internal) ---
      # Bind listener strictly to the Private IP (Free bandwidth, Secure)
      - CASSANDRA_LISTEN_ADDRESS=10.104.0.2
      - CASSANDRA_BROADCAST_ADDRESS=10.104.0.2
      
      # --- SEED CONFIG ---
      # I am the first seed. Point to myself.
      - CASSANDRA_SEEDS=10.104.0.2

      # --- CLIENT ACCESS (External) ---
      # Listen for clients on all interfaces (0.0.0.0)
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      # Tell your Laptop (the client) to talk to the PUBLIC IP
      - CASSANDRA_BROADCAST_RPC_ADDRESS=159.223.51.176

      # --- MEMORY TUNING (16GB Server) ---
      # We allocate 8GB to DB, leaving 8GB for Next.js & OS
      - MAX_HEAP_SIZE=8G
      - HEAP_NEWSIZE=2G
    
    volumes:
      - cassandra-data:/var/lib/cassandra

    # Healthcheck to verify node is up
    healthcheck:
      test: ["CMD", "cqlsh", "10.104.0.2", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  cassandra-data:
